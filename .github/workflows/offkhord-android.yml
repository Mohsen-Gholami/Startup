name: Build OffKhord Android
on:
  push:
    branches: [offkhord-android-build]
    paths:
      - 'offkhord-android/**'
      - '.github/workflows/offkhord-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offkhord-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK and release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Upload Android outputs
        uses: actions/upload-artifact@v4
        with:
          name: offkhord-android-device-test
          path: |
            offkhord-android/app/build/outputs/apk/debug/*.apk
            offkhord-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
